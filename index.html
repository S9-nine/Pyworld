<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Code Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Lexend:wght@300;400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: a sea-chart world map is home base; a quest board sits beside it; levels open as a full-width workshop with a dark code bench. */
:root {
  --bg: #E8EFF7; --surface: #FFFFFF; --surface-2: #F3F7FC; --sunk: #DCE6F1;
  --ink: #14223B; --muted: #55657E; --line: #C8D4E3;
  --sun: #F4B400; --sun-ink: #2E2200; --sun-soft: #FFF0BF;
  --coral: #DB4F3B; --sea: #2A6FAD; --sea-soft: #D6E7F7;
  --grass: #23845A; --grass-soft: #D5EFE1; --danger: #C2372B; --danger-soft: #FBE0DC;
  --water: #BBD6EE; --water-line: #A5C6E4; --land: #E2EED3; --land-edge: #A9C78A; --route: #5F7898;
  --code-bg: #0F1A2C; --code-ink: #E3EBF6; --code-muted: #7284A3; --code-line: #1D2C46; --code-sel: #2A4A78;
  --tok-kw: #FF92A8; --tok-str: #A3E58F; --tok-num: #FFC870; --tok-fn: #80CAFF; --tok-com: #7284A3;
  --shadow: 0 1px 2px rgb(20 34 59 / .06), 0 6px 20px rgb(20 34 59 / .07);
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1220; --surface: #111C30; --surface-2: #16243D; --sunk: #0D1727;
    --ink: #E5ECF6; --muted: #98A8C1; --line: #24365A;
    --sun: #F7C431; --sun-ink: #241A00; --sun-soft: #3A3011;
    --coral: #FF7B66; --sea: #63AAEA; --sea-soft: #142D4A;
    --grass: #4FCB8C; --grass-soft: #11331F; --danger: #FF6E61; --danger-soft: #3B1714;
    --water: #0E213B; --water-line: #15304F; --land: #1B342C; --land-edge: #2E5A47; --route: #8DA4C6;
    --code-bg: #08101D; --code-line: #172540;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1220; --surface: #111C30; --surface-2: #16243D; --sunk: #0D1727;
  --ink: #E5ECF6; --muted: #98A8C1; --line: #24365A;
  --sun: #F7C431; --sun-ink: #241A00; --sun-soft: #3A3011;
  --coral: #FF7B66; --sea: #63AAEA; --sea-soft: #142D4A;
  --grass: #4FCB8C; --grass-soft: #11331F; --danger: #FF6E61; --danger-soft: #3B1714;
  --water: #0E213B; --water-line: #15304F; --land: #1B342C; --land-edge: #2E5A47; --route: #8DA4C6;
  --code-bg: #08101D; --code-line: #172540;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
a { color: var(--sea); }
:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; border-radius: 6px; }
code { font-family: var(--font-code); font-size: .88em; background: var(--sunk); padding: .08em .35em; border-radius: 5px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
.pixel { font-family: var(--font-display); letter-spacing: .02em; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ── Top bar ── */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
.brand-mark { width: 34px; height: 34px; }
.brand-name { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: .02em; }
.nav { display: flex; gap: 4px; margin-left: 8px; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 7px 12px; border-radius: 999px; color: var(--muted); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.nav button:hover { color: var(--ink); background: var(--surface-2); }
.nav button[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--coral); color: #fff; font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--grass); }
.sync[data-s="saving"]::before { background: var(--sun); }
.sync[data-s="local"]::before { background: var(--muted); }
.sync[data-s="error"]::before { background: var(--danger); }
.hero-chip { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px 4px 4px; box-shadow: var(--shadow); }
.hero-chip .meta { display: grid; gap: 2px; text-align: left; min-width: 0; }
.hero-chip .nm { font-weight: 600; font-size: 13px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.hero-chip .rk { font-size: 11px; color: var(--muted); line-height: 1.1; }
.xpbar { width: 96px; height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.xpbar > i { display: block; height: 100%; background: var(--sun); border-radius: 99px; transition: width .5s ease; }
.streak { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 14px; color: var(--coral); }
.streak svg { width: 18px; height: 18px; }

.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; position: relative; }
.avatar svg { width: 58%; height: 58%; }
.avatar.sm { width: 28px; height: 28px; }
.avatar.lg { width: 64px; height: 64px; }

.banner { background: var(--sun-soft); border-bottom: 1px solid var(--line); font-size: 13px; }
.banner .wrap { padding-block: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ── Buttons ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; transition: transform .08s ease, background .15s; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--sun); border-color: color-mix(in srgb, var(--sun) 70%, #000); color: var(--sun-ink); box-shadow: 0 3px 0 color-mix(in srgb, var(--sun) 60%, #000); }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--sun) 88%, #fff); }
.btn.go { background: var(--grass); border-color: var(--grass); color: #fff; }
.btn.go:hover:not(:disabled) { background: color-mix(in srgb, var(--grass) 88%, #000); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--ink); background: var(--surface-2); }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn svg { width: 16px; height: 16px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.panel-h h2 { font-size: 16px; font-weight: 600; }

/* ── Home ── */
.home { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; padding-block: 22px 48px; }
.home-main, .home-side { display: grid; gap: 20px; align-content: start; min-width: 0; }
.hello { display: flex; gap: 18px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.hello h1 { font-family: var(--font-display); font-size: clamp(26px, 4vw, 36px); font-weight: 700; }
.hello p { color: var(--muted); max-width: 52ch; }
.continue { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.continue .lvl-badge { font-family: var(--font-display); font-size: 20px; width: 52px; height: 52px; border-radius: 12px; background: var(--sun-soft); color: var(--ink); display: grid; place-items: center; flex: none; border: 2px solid var(--sun); }
.map-card { padding: 0; overflow: hidden; position: relative; }
.map-scroll { overflow-x: auto; }
.map-scroll svg { display: block; width: 100%; min-width: 600px; height: auto; }
.map-legend { font-size: 12.5px; color: var(--muted); padding: 8px 14px; border-top: 1px solid var(--line); }
.world-node { cursor: pointer; }
.world-node:focus-visible { outline: none; }
.world-node:focus-visible .node-ring { stroke: var(--sea); stroke-width: 5; }
.token-me { animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

.loop { padding: 18px; }
.loop ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.loop li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.loop li.done { opacity: .7; }
.loop .ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); }
.loop .ico svg { width: 18px; height: 18px; }
.loop li.done .ico { background: var(--grass); border-color: var(--grass); color: #fff; }
.loop .t { font-weight: 600; font-size: 14px; }
.loop .d { font-size: 12.5px; color: var(--muted); }
.loop .tm { font-size: 12px; color: var(--muted); white-space: nowrap; }

.side-card { padding: 18px; }
.goal { display: flex; gap: 16px; align-items: center; }
.goal svg { width: 74px; height: 74px; flex: none; }
.board { display: grid; gap: 4px; }
.board-row { display: grid; grid-template-columns: 22px 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; }
.board-row.me { background: var(--sun-soft); }
.board-row .pos { font-family: var(--font-display); color: var(--muted); text-align: center; }
.board-row .who { min-width: 0; }
.board-row .who b { display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board-row .who span { font-size: 12px; color: var(--muted); }
.board-row .xp { font-family: var(--font-display); font-size: 16px; text-align: right; }
.board-row .xp small { display: block; font-family: var(--font-body); font-size: 11px; color: var(--muted); }
.skills { display: grid; gap: 10px; }
.skill { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 4px 10px; font-size: 13px; }
.skill .bar { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.skill .bar i { display: block; height: 100%; background: var(--sea); border-radius: 99px; }
.skill .pct { text-align: right; color: var(--muted); }
.ready-total { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
.ready-total b { font-family: var(--font-display); font-size: 34px; line-height: 1; }

/* ── World ── */
.world-head { padding-block: 26px 8px; display: grid; gap: 8px; }
.world-head h1 { font-family: var(--font-display); font-size: clamp(30px, 5vw, 44px); }
.crumb { background: none; border: 0; padding: 0; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.crumb:hover { color: var(--ink); }
.crumb svg { width: 16px; height: 16px; }
.world-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; padding-block: 12px 56px; }
.trail { position: relative; display: grid; gap: 14px; padding-left: 0; }
.trail-item { position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; align-items: center; }
.trail-item::before { content: ""; position: absolute; left: 31px; top: -14px; height: 14px; border-left: 3px dashed var(--route); opacity: .5; }
.trail-item:first-child::before { display: none; }
.stone { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-family: var(--font-display); font-size: 24px; background: var(--surface); border: 3px solid var(--line); position: relative; }
.trail-item.open .stone { border-color: var(--sun); background: var(--sun-soft); }
.trail-item.clear .stone { border-color: var(--grass); background: var(--grass); color: #fff; }
.trail-item.locked .stone { color: var(--muted); }
.trail-item.boss .stone { border-radius: 50%; }
.stone svg { width: 24px; height: 24px; }
.trail-card { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 16px; text-align: left; width: 100%; flex-wrap: wrap; }
.trail-card:hover:not(:disabled) { border-color: var(--sea); }
.trail-card h3 { font-size: 16px; font-weight: 600; }
.trail-card .c { font-size: 13px; color: var(--muted); }
.stars { display: inline-flex; gap: 2px; }
.stars svg { width: 18px; height: 18px; }
.stars .on { color: var(--sun); }
.stars .off { color: var(--line); }
.here { display: flex; gap: -6px; }
.here .avatar { margin-left: -6px; border: 2px solid var(--surface); }
.stage-dots { display: flex; gap: 4px; }
.stage-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.stage-dots i.on { background: var(--grass); }
.quest-list { display: grid; gap: 8px; }
.quest-item { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px; border-radius: 10px; background: var(--surface-2); cursor: pointer; }
.quest-item input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--grass); }
.quest-item b { font-weight: 600; font-size: 14px; display: block; }
.quest-item span { font-size: 12.5px; color: var(--muted); }
.res { display: grid; gap: 10px; }
.res a { display: block; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); text-decoration: none; color: var(--ink); }
.res a:hover { background: var(--sea-soft); }
.res a b { display: block; font-size: 14px; }
.res a span { font-size: 12.5px; color: var(--muted); }

/* ── Level ── */
.level-head { padding-block: 18px 14px; display: grid; gap: 14px; }
.level-title { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.level-title h1 { font-family: var(--font-display); font-size: clamp(24px, 4vw, 34px); }
.stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.step { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; text-align: left; display: grid; gap: 1px; position: relative; overflow: hidden; }
.step .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.step .v { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.step .v svg { width: 15px; height: 15px; color: var(--grass); flex: none; }
.step[aria-current="step"] { border-color: var(--sun); box-shadow: inset 0 -3px 0 var(--sun); }
.step:hover { background: var(--surface-2); }
.stage { padding-block: 6px 64px; }
.stage-intro { display: flex; gap: 12px; align-items: baseline; margin-bottom: 16px; flex-wrap: wrap; }
.stage-intro h2 { font-family: var(--font-display); font-size: 24px; }
.learn-grid { display: grid; gap: 16px; max-width: 860px; }
.lcard { padding: 18px; display: grid; gap: 12px; }
.lcard h3 { font-size: 18px; font-weight: 600; }
.lcard p { max-width: 68ch; }
.next-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; max-width: 860px; }

.q { max-width: 760px; padding: 22px; display: grid; gap: 16px; }
.q h3 { font-size: 18px; font-weight: 600; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.opt .l { width: 30px; height: 30px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); }
.opt .tx { font-family: var(--font-code); font-size: 14px; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--sea); }
.opt.right { border-color: var(--grass); background: var(--grass-soft); }
.opt.right .l { background: var(--grass); color: #fff; border-color: var(--grass); }
.opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
.opt:disabled { opacity: 1; cursor: default; }
.why { padding: 12px 14px; border-radius: 10px; background: var(--sea-soft); font-size: 14px; }
.why.good { background: var(--grass-soft); }
.why b { display: block; margin-bottom: 2px; }
.order-pool, .order-answer { display: grid; gap: 6px; }
.order-answer { min-height: 60px; padding: 10px; border: 2px dashed var(--line); border-radius: 10px; }
.chip { text-align: left; font-family: var(--font-code); font-size: 13.5px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); overflow-wrap: anywhere; }
.chip:hover { border-color: var(--sea); }
.order-answer .chip { background: var(--surface); display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; }
.order-answer .chip i { font-style: normal; color: var(--muted); font-family: var(--font-display); }
.qprog { display: flex; gap: 6px; }
.qprog i { width: 28px; height: 6px; border-radius: 99px; background: var(--line); }
.qprog i.on { background: var(--sun); }
.qprog i.ok { background: var(--grass); }

.forge { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
.brief { padding: 18px; display: grid; gap: 14px; }
.brief .task { font-size: 15.5px; }
.sample { background: var(--code-bg); color: var(--code-ink); font-family: var(--font-code); font-size: 13px; border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; margin: 0; overflow-x: auto; }
.sample-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.hints { display: grid; gap: 8px; }
.hint { padding: 10px 12px; border-radius: 10px; background: var(--sun-soft); font-size: 14px; }
.hint b { font-family: var(--font-display); font-weight: 500; margin-right: 6px; }
.sage { padding: 12px 14px; border-radius: 10px; background: var(--sea-soft); font-size: 14px; display: grid; gap: 4px; }
.sage b { display: flex; gap: 6px; align-items: center; }
.sage svg { width: 16px; height: 16px; }
.tests { display: grid; gap: 6px; }
.test { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 13.5px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.test .s { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--surface); font-size: 12px; }
.test.pass .s { background: var(--grass); color: #fff; }
.test.fail { background: var(--danger-soft); }
.test.fail .s { background: var(--danger); color: #fff; }
.test .s svg { width: 12px; height: 12px; }
.test .msg { overflow-wrap: anywhere; min-width: 0; }
.notice { padding: 10px 12px; border-radius: 10px; font-size: 14px; background: var(--danger-soft); }
.notice.good { background: var(--grass-soft); }

/* ── Code bench ── */
.bench { background: var(--code-bg); border-radius: var(--r); overflow: hidden; border: 1px solid var(--code-line); box-shadow: var(--shadow); min-width: 0; }
.bench-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--code-line); color: var(--code-muted); font-size: 12px; flex-wrap: wrap; }

/* SVG markup for a sprite, merging horizontal runs into single rects. */
const _pixCache = {};
function pixelSvg(i, size) {
  const idx = ((i | 0) % SPRITES.length + SPRITES.length) % SPRITES.length;
  if (!_pixCache[idx]) {
    const sp = SPRITES[idx], pal = Object.assign({}, PIX_BASE, sp.pal);
    let rects = "";
    sp.rows.forEach((row, y) => {
      let x = 0;
      while (x < row.length) {
        const ch = row[x];
        let run = 1;
        while (x + run < row.length && row[x + run] === ch) run++;
        if (ch !== "." && pal[ch]) rects += `<rect x="${x}" y="${y}" width="${run}" height="1" fill="${pal[ch]}"/>`;
        x += run;
      }
    });
    _pixCache[idx] = rects;
  }
  return `<svg viewBox="0 0 12 12" ${size ? `width="${size}" height="${size}"` : ""} shape-rendering="crispEdges" aria-hidden="true">${_pixCache[idx]}</svg>`;
}

/* Python runner (Skulpt) and test checker. */

let pyBusy = false;
let pyStopRequested = false;

class InputExhausted extends Error {}

/* Run Python source.
   opts.inputs: array of strings for test mode, or null for interactive.
   opts.ask(prompt): Promise<string> used in interactive mode.
   opts.onOut(text): streaming output callback.
   Resolves { out, prompts, error } where error = { name, msg, line } or null. */
async function runPython(code, opts = {}) {
  if (typeof Sk === "undefined") {
    return { out: "", prompts: [], error: { name: "EngineNotReady", msg: "The Python engine is still loading. Try again in a moment.", line: null } };
  }
  if (pyBusy) return { out: "", prompts: [], error: { name: "Busy", msg: "Another program is still running.", line: null } };
  pyBusy = true;
  pyStopRequested = false;
  let out = "";
  const prompts = [];
  const queue = opts.inputs ? opts.inputs.slice() : null;
  const emit = (t) => { out += t; if (opts.onOut) opts.onOut(t); };
  const limit = opts.limit || 4000;
  Sk.configure({
    output: emit,
    read: (x) => {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles.files[x] === undefined) throw "File not found: '" + x + "'";
      return Sk.builtinFiles.files[x];
    },
    inputfunTakesPrompt: true,
    inputfun: (prompt) => {
      prompt = prompt == null ? "" : String(prompt);
      if (queue) {
        if (!queue.length) return Promise.reject(new InputExhausted("more"));
        const v = queue.shift();
        prompts.push(norm(prompt + v));
        emit(prompt + v + "\n");
        return Promise.resolve(v);
      }
      emit(prompt);
      return (opts.ask ? opts.ask(prompt) : Promise.resolve("")).then((v) => {
        emit(v + "\n");
        Sk.execStart = Date.now();
        return v;
      });
    },
    __future__: Sk.python3,
    execLimit: limit,
    yieldLimit: 100,
    killableWhile: true,
    killableFor: true
  });
  let error = null;
  try {
    await Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true), {
      "*": () => { if (pyStopRequested) throw new Sk.builtin.TimeLimitError("Stopped"); }
    });
  } catch (e) {
    error = describeError(e);
  } finally {
    pyBusy = false;
  }
  return { out, prompts, error };
}

function stopPython() {
  pyStopRequested = true;
  if (typeof Sk !== "undefined") Sk.execLimit = 1;
}

function describeError(e) {
  if (e instanceof InputExhausted || (e && e.message === "more")) {
    return { name: "InputError", msg: "Your program asked for more input than this test provides.", line: null };
  }
  let name = "Error", msg = String(e), line = null;
  if (e && e.tp$name) {
    name = e.tp$name;
    try {
      const args = e.args && e.args.v;
      msg = args && args.length ? String(Sk.ffi.remapToJs(args[0])) : "";
    } catch (_) { msg = String(e); }
    if (e.traceback && e.traceback.length) line = e.traceback[0].lineno;
  }
  if (pyStopRequested && name === "TimeLimitError") msg = "Stopped";
  return { name, msg, line };
}

/* Plain-language explanation of a Python error, for beginners. */
function friendlyError(err) {
  const n = err.name, m = err.msg || "";
  if (n === "SyntaxError" || n === "ParseError" || n === "TokenError")
    return "Python couldn't read this line. Common causes: a missing closing quote or bracket, a missing colon after if / elif / else, a single = where you meant ==, or wrong indentation.";
  if (n === "IndentationError")
    return "The spaces at the start of a line are off. Lines inside an if or else need 4 spaces, and lines at the same level must line up.";
  if (n === "NameError") {
    const mm = /name '([^']+)'/.exec(m);
    return (mm ? "Python doesn't know the name <code>" + escapeHtml(mm[1]) + "</code>. " : "Python doesn't know a name you used. ") +
      "Check the spelling and capitals, make sure you created the variable before using it, and put text inside quotes.";
  }
  if (n === "TypeError" && /concatenate|must be str|can only concatenate/.test(m))
    return "You tried to join text and a number with +. Convert the number with <code>str()</code>, or use an f-string.";
  if (n === "TypeError" && /unsupported operand|can't multiply/.test(m))
    return "You're doing math on text. Remember <code>input()</code> gives a string, so wrap it in <code>int()</code> or <code>float()</code>.";
  if (n === "TypeError") return "A value is the wrong type for what you're doing with it. Check which values are strings and which are numbers.";
  if (n === "ValueError" && /invalid literal/.test(m))
    return "<code>int()</code> got text that isn't a whole number. Check what's being converted.";
  if (n === "ZeroDivisionError") return "You divided by zero. Check the number you're dividing by.";
  if (n === "TimeLimitError") return m === "Stopped" ? "You stopped the program." : "Your program ran too long. This usually means a loop that never ends.";
  if (n === "InputError") return "Check how many times you call <code>input()</code>. This test only types in the values listed.";
  if (n === "EngineNotReady" || n === "Busy") return m;
  return "Read the message: the error name and the line number tell you where to look.";
}

const norm = (s) => String(s).replace(/ /g, " ").replace(/[ \t]+/g, " ").trim();

function outputLines(out, prompts) {
  return out.split("\n").map(norm).filter((l) => l !== "" && !prompts.includes(l));
}

/* Run a level's tests. Returns { pass, results:[{pass, input, msg, out}], codeMsg } */
async function runTests(task, code) {
  const stripped = code.replace(/#.*$/gm, "");
  for (const [re, msg] of task.must || []) {
    if (!new RegExp(re).test(stripped)) return { pass: false, results: [], codeMsg: msg };
  }
  for (const [re, msg] of task.mustNot || []) {
    const codeOnly = stripped.split("\n").filter((l) => /print\(|=/.test(l)).join("\n");
    if (new RegExp(re).test(codeOnly)) return { pass: false, results: [], codeMsg: msg };
  }
  const results = [];
  for (const t of task.tests) {
    const r = await runPython(code, { inputs: t.in, limit: 3000 });
    const res = { input: t.in, out: r.out, pass: true, msg: "" };
    if (r.error) {
      res.pass = false;
      res.error = r.error;
      res.msg = r.error.name + (r.error.msg ? ": " + r.error.msg : "") + (r.error.line ? " (line " + r.error.line + ")" : "");
    } else {
      const lines = outputLines(r.out, r.prompts);
      for (const want of t.out) {
        if (!lines.includes(norm(want))) {
          res.pass = false;
          const close = lines.find((l) => l.toLowerCase().replace(/[^a-z0-9]/g, "") === norm(want).toLowerCase().replace(/[^a-z0-9]/g, ""));
          res.msg = close
            ? "Close! Expected <code>" + escapeHtml(want) + "</code> but got <code>" + escapeHtml(close) + "</code>. Check capitals, spaces and punctuation."
            : "Expected a line <code>" + escapeHtml(want) + "</code>.";
          break;
        }
      }
      if (res.pass && t.not) {
        for (const bad of t.not) if (lines.includes(norm(bad))) { res.pass = false; res.msg = "This case should not print <code>" + escapeHtml(bad) + "</code>."; break; }
      }
      if (res.pass && t.only && lines.length !== t.out.length) {
        res.pass = false;
        res.msg = "Print only <code>" + escapeHtml(t.out.join(" / ")) + "</code> for this case. Extra lines appeared.";
      }
      if (res.pass && t.check === "name") {
        if (!lines.some((l) => /^My name is \S+/.test(l))) { res.pass = false; res.msg = "Line 2 should start with <code>My name is</code> followed by a name."; }
      }
    }
    results.push(res);
  }
  return { pass: results.every((r) => r.pass), results, codeMsg: "" };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let saveTimer = null, saving = false, savePending = false;
function save() {
  if (!S.hero) return;
  recompute();

  if (S.mode === "cloud") {

async function flush() {
  if (S.mode !== "cloud" || !S.ref) return;

  saving = true;
  try {
    await S.ref.set(JSON.parse(JSON.stringify(S.hero)));
    setSync("ok", "Saved");
  } catch (e) {
    if (e && e.code === "invalid_argument") {

      showBanner("You can see the Guild board, but your account can't save here yet. Your progress is kept in this browser. Ask the game's owner to give you Editor access.");
      setSync("local", "Saved on this device");
    } else if (e && e.code === "unavailable") {
      setSync("error", "Retrying save…");
      setTimeout(() => { saving = false; flush(); }, 1500 + Math.random() * 1500);

}

/* ───────── Progress logic ───────── */
function lv(id) { return (S.hero.lv[id] = S.hero.lv[id] || {}); }
function stageDone(id, stage) {
  const s = S.hero.lv[id] || {}, L = levelById(id);
  if (stage === "learn") return !!s.l;
  if (stage === "think") return !!s.t && L.think.every((_, i) => s.t[i]);
  if (stage === "code") return !!(s.c && s.c.ok);
  if (stage === "bug") return !!s.b;
  if (stage === "explain") return !!s.e;
}
const levelClear = (id) => STAGES.every((st) => stageDone(id, st.id));
function levelUnlocked(id) {
  const i = LEVELS.findIndex((l) => l.id === id);
  return i === 0 || stageDone(LEVELS[i - 1].id, "code");
}

}

function recompute() {
  const h = S.hero;
  h.stars = LEVELS.reduce((a, L) => a + ((h.lv[L.id] && h.lv[L.id].c && h.lv[L.id].c.s) || 0), 0);
  h.done = LEVELS.filter((L) => levelClear(L.id)).length;

}
function addXP(n, label) {
  const h = S.hero, t = today();
  const before = rankFor(h.xp).r;
  h.xp += n;
  h.days[t] = (h.days[t] || 0) + n;
  if (h.last !== t) {
    h.streak = h.last === addDays(t, -1) ? h.streak + 1 : 1;
    h.last = t;
    h.best = Math.max(h.best, h.streak);
  }
  const keys = Object.keys(h.days).sort();
  while (keys.length > 21) delete h.days[keys.shift()];
  toast(`<span class="x">+${n} XP</span> ${esc(label)}`);
  const after = rankFor(h.xp).r;
  if (after !== before) setTimeout(() => toast(`<span class="x">Rank up!</span> You're now a ${esc(after.name)}`), 600);

    const share = STAGES.filter((st) => stageDone(L.id, st.id)).length / STAGES.length;

  let f = 0;

const KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
const BI = new Set("print input int float str bool len range type round abs min max sum sorted list dict set tuple enumerate zip isinstance".split(" "));
function highlight(src) {
  const re = /(#[^\n]*)|([fFrRbB]?(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?))|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += `<span class="tk-com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="tk-str">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="tk-num">${esc(m[3])}</span>`;
    else if (m[4]) out += KW.has(m[4]) ? `<span class="tk-kw">${m[4]}</span>` : BI.has(m[4]) ? `<span class="tk-fn">${m[4]}</span>` : m[4];
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function createEditor(host, code, { onChange, id } = {}) {
  host.innerHTML = `<div class="editor"><div class="gutter" aria-hidden="true"></div><div class="code-scroll"><div class="code-inner"><pre aria-hidden="true"><code></code></pre><textarea id="${id || ""}" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Python code editor. Press Escape then Tab to leave."></textarea></div></div></div>`;
  const ta = $("textarea", host), pre = $("code", host), gut = $(".gutter", host);
  let errLine = null, escaped = false;
  const paint = () => {
    pre.innerHTML = highlight(ta.value) + "\n";
    const n = ta.value.split("\n").length;
    let g = "";
    for (let i = 1; i <= n; i++) g += `<div class="${i === errLine ? "err" : ""}">${i}</div>`;
    gut.innerHTML = g;
  };
  const insert = (text) => {
    ta.focus();
    if (!document.execCommand || !document.execCommand("insertText", false, text)) {
      ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, "end");
      ta.dispatchEvent(new Event("input"));
    }
  };
  ta.value = code;
  ta.addEventListener("input", () => { errLine = null; paint(); if (onChange) onChange(ta.value); });
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { escaped = true; return; }
    if (e.key === "Tab" && !escaped) {
      e.preventDefault();
      const v = ta.value, s = ta.selectionStart;
      if (e.shiftKey) {
        const ls = v.lastIndexOf("\n", s - 1) + 1;
        const m = /^ {1,4}/.exec(v.slice(ls));
        if (m) { ta.setSelectionRange(ls, ls + m[0].length); insert(""); }
      } else insert("    ");

    }
    escaped = false;
    if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      const v = ta.value, s = ta.selectionStart;
      const line = v.slice(v.lastIndexOf("\n", s - 1) + 1, s);
      let ind = /^\s*/.exec(line)[0];

      return;
    }
    if (e.key === "Backspace" && ta.selectionStart === ta.selectionEnd) {
      const v = ta.value, s = ta.selectionStart;
      const before = v.slice(v.lastIndexOf("\n", s - 1) + 1, s);
      if (before.length >= 4 && /^ +$/.test(before) && before.length % 4 === 0) { e.preventDefault(); ta.setSelectionRange(s - 4, s); insert(""); }
    }
  });

  return {
    get: () => ta.value,
    set: (c) => { ta.value = c; errLine = null; paint(); if (onChange) onChange(c); },
    mark: (n) => { errLine = n; paint(); },
    focus: () => ta.focus()
  };
}
function createConsole(el) {

    error(err) {
      const s = document.createElement("span");
      s.className = "err";
      s.textContent = `${el.textContent && !el.textContent.endsWith("\n") ? "\n" : ""}${err.name}${err.msg ? ": " + err.msg : ""}${err.line ? "  (line " + err.line + ")" : ""}`;
      el.appendChild(s);
      const x = document.createElement("span");
      x.className = "explain";
      x.innerHTML = friendlyError(err);
      el.appendChild(x);
      el.scrollTop = el.scrollHeight;
    },
    ask() {
      return new Promise((resolve) => {
        const inp = document.createElement("input");
        inp.setAttribute("aria-label", "Type your answer and press Enter");
        el.appendChild(inp);
        inp.focus();
        pendingAsk = () => { inp.remove(); resolve(""); };
        inp.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            const v = inp.value;
            inp.remove();
            pendingAsk = null;
            resolve(v);
          }
        });
      });
    },
    cancel() { if (pendingAsk) { pendingAsk(); pendingAsk = null; } }
  };
}
/* Run button wiring shared by examples, forge and bug hunt. */
async function runInBench(ed, con, runBtn) {
  if (pyBusy) {
    stopPython(); con.cancel(); return;
  }
  con.clear();
  runBtn.innerHTML = ICON.stop + " Stop";
  const r = await runPython(ed.get(), { ask: () => con.ask(), onOut: (t) => con.write(t), limit: 6000 });
  runBtn.innerHTML = ICON.play + " Run";
  if (r.error) { con.error(r.error); if (r.error.line) ed.mark(r.error.line); }
  else if (!r.out) con.hint("(Your program ran but printed nothing.)");
  return r;
}

function stageThink(host, L) {
  const s = lv(L.id);
  s.t = s.t || [];
  let qi = Math.max(0, L.think.findIndex((_, i) => !s.t[i]));
  if (qi === -1 || s.t.length >= L.think.length && L.think.every((_, i) => s.t[i])) qi = 0;
  const show = () => {
    const q = L.think[qi];
    const prog = L.think.map((_, i) => `<i class="${s.t[i] === 1 ? "ok" : s.t[i] ? "on" : i === qi ? "on" : ""}"></i>`).join("");
    host.innerHTML = `
      <div class="stage-intro"><h2>Oracle's Riddles</h2><span class="muted">No coding, just thinking. Predict before you peek.</span></div>
      <div class="card q">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="eyebrow">Riddle ${qi + 1} of ${L.think.length}</span><span class="qprog">${prog}</span></div>
        <h3>${q.q}</h3>
        ${q.code ? `<pre class="sample">${highlight(q.code)}</pre>` : ""}
        <div id="qBody"></div>
        <div id="qWhy"></div>
        <div class="row" style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap" id="qNav"></div>
      </div>`;
    const body = $("#qBody"), why = $("#qWhy"), nav = $("#qNav");
    const answered = (correct) => {
      const first = !s.t[qi];
      if (first) { s.t[qi] = correct ? 1 : 2; addXP(correct ? XP.think : XP.thinkRetry, correct ? "Riddle solved" : "Learned from a miss"); }
      why.innerHTML = `<div class="why ${correct ? "good" : ""}"><b>${correct ? "Correct!" : "Not quite."}</b>${q.why}</div>`;
      const last = qi === L.think.length - 1;
      nav.innerHTML = last ? nextStageBtn(L, "think") : `<button class="btn primary" id="qNext">Next riddle</button>`;
      if (last) { bindNext(host, L); afterStage(L); }
      else $("#qNext").addEventListener("click", () => { qi++; show(); });
    };
    if (q.type === "mcq") {
      body.innerHTML = `<div class="opts">${q.options.map((o, i) => `<button class="opt" data-o="${i}"><span class="l">${"ABCD"[i]}</span><span class="tx">${q.options[i].includes("<") ? o : esc(o)}</span></button>`).join("")}</div>`;
      $$("[data-o]", body).forEach((b) => b.addEventListener("click", () => {
        const pick = +b.dataset.o, ok = pick === q.answer;
        $$("[data-o]", body).forEach((x) => { x.disabled = true; if (+x.dataset.o === q.answer) x.classList.add("right"); });
        if (!ok) b.classList.add("wrong");
        answered(ok);
      }));
    } else if (q.type === "order") {
      const order = q.lines.map((_, i) => i);
      do { order.sort(() => Math.random() - .5); } while (order.every((v, i) => v === i));
      let picked = [];
      const draw = () => {
        body.innerHTML = `<p class="muted" style="font-size:13px;margin-bottom:8px">Tap lines in the order they should run. Tap a placed line to remove it.</p>
          <div class="order-answer" aria-label="Your order">${picked.map((i, k) => `<button class="chip" data-un="${k}"><i>${k + 1}</i><span>${esc(q.lines[i])}</span></button>`).join("") || '<span class="muted" style="font-size:13px">Your program builds here</span>'}</div>
          <div class="order-pool" style="margin-top:10px">${order.filter((i) => !picked.includes(i)).map((i) => `<button class="chip" data-pk="${i}">${esc(q.lines[i])}</button>`).join("")}</div>`;
        $$("[data-pk]", body).forEach((b) => b.addEventListener("click", () => { picked.push(+b.dataset.pk); draw(); }));
        $$("[data-un]", body).forEach((b) => b.addEventListener("click", () => { picked.splice(+b.dataset.un, 1); draw(); }));
        nav.innerHTML = picked.length === q.lines.length ? `<button class="btn primary" id="qCheck">Check order</button>` : "";
        const ck = $("#qCheck");
        if (ck) ck.addEventListener("click", () => {
          const ok = picked.every((v, i) => v === i);
          $$(".chip", body).forEach((x) => (x.disabled = true));
          if (!ok) body.insertAdjacentHTML("beforeend", `<div class="sample" style="margin-top:10px">${q.lines.map((l, i) => `${i + 1}  ${esc(l)}`).join("\n")}</div>`);
          answered(ok);
        });
      };
      draw();
    }
    if (s.t[qi]) {
      // Already answered before: show review mode
      if (q.type === "mcq") {
        $$("[data-o]", body).forEach((x) => { x.disabled = true; if (+x.dataset.o === q.answer) x.classList.add("right"); });
        answered(s.t[qi] === 1);
      }
    }
  };
  show();
}

function challengeStage(host, L, kind) {
  const isBug = kind === "bug";
  const task = isBug ? L.bug : L.code;
  const s = lv(L.id);
  const draftKey = draftNS() + L.id + "." + kind;
  const startCode = lsGet(draftKey) || (isBug ? task.code : task.starter);
  const meta = isBug ? (s.bm = s.bm || { h: 0 }) : (s.cm = s.cm || { h: 0, sage: 0, fails: 0, rev: 0 });
  const hints = isBug ? [task.hint] : task.hints;
  host.innerHTML = `
    <div class="stage-intro"><h2>${isBug ? "Bug Hunt" : "The Forge"}</h2><span class="muted">${isBug ? "Run it, read the error, fix it, check it." : "Plan in comments, write the code, run it, then check it."}</span></div>
    <div class="forge">
      <div class="card brief">
        <div class="eyebrow">${isBug ? "The bug report" : "Your quest"}</div>
        <div class="task">${task.brief}</div>
        ${task.sample ? `<div><div class="sample-label">Example run</div><pre class="sample">${esc(task.sample)}</pre></div>` : ""}
        <div><div class="sample-label">The checker will try</div><div class="tests" id="tests">${task.tests.map((t, i) => `<div class="test"><span class="s">${i + 1}</span><span class="msg">${t.in.length ? "Typing: " + t.in.map((x) => `<code>${esc(x)}</code>`).join(" then ") : "Running your program"}</span></div>`).join("")}</div></div>
        <div id="codeMsg"></div>
        <div class="hints" id="hints"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap" id="helpRow"></div>
        <div id="sageBox"></div>
      </div>
      <div class="bench">
        <div class="bench-bar"><span class="file"><i></i>${isBug ? "bug_hunt" : "quest"}_${L.id.replace("-", "_")}.py</span>
          <button class="btn sm" id="resetBtn">${ICON.reset} Reset</button>
          <button class="btn sm go" id="runBtn">${ICON.play} Run</button>
          <button class="btn sm primary" id="checkBtn">${ICON.check} Check</button></div>
        <div id="ed"></div>
        <div class="console" id="con"></div>
      </div>
    </div>
    <div class="next-row" id="stageNext" style="max-width:none">${(isBug ? s.b : s.c && s.c.ok) ? nextStageBtn(L, kind) : ""}</div>`;
  const ed = createEditor($("#ed", host), startCode, { onChange: (c) => lsSet(draftKey, c), id: "code-" + kind });
  const con = createConsole($("#con", host));
  con.hint(isBug ? "Press Run to see what goes wrong." : "Press Run to try your code. Press Check when you think it's right.");
  bindNext(host, L);

  const drawHints = () => {
    const shown = isBug ? meta.h : meta.h;
    $("#hints", host).innerHTML = hints.slice(0, shown).map((h, i) => `<div class="hint"><b>Hint ${i + 1}</b>${h}</div>`).join("");
    const row = $("#helpRow", host);
    let html = "";
    if (shown < hints.length) html += `<button class="btn sm" id="hintBtn">Show hint ${shown + 1}${isBug ? "" : " (costs a star)"}</button>`;
    if (S.sample) html += `<button class="btn sm" id="sageBtn">${ICON.sage} Ask the Sage</button>`;
    if (!isBug && !(s.c && s.c.ok) && (meta.h >= hints.length || meta.fails >= 4)) html += `<button class="btn sm ghost" id="revealBtn">Show a solution</button>`;
    row.innerHTML = html;
    const hb = $("#hintBtn", host); if (hb) hb.addEventListener("click", () => { meta.h++; save(); drawHints(); });
    const sb = $("#sageBtn", host); if (sb) sb.addEventListener("click", () => askSage(sb));
    const rb = $("#revealBtn", host); if (rb) rb.addEventListener("click", () => {
      meta.rev = 1; save();
      $("#hints", host).insertAdjacentHTML("beforeend", `<div class="hint"><b>One solution</b>Read it, then close it and type it yourself from memory. Typing it beats pasting it.<pre class="sample" style="margin-top:8px">${highlight(task.solution)}</pre></div>`);
      rb.remove();
    });
  };
  drawHints();

  const askSage = async (btn) => {
    btn.disabled = true;
    const box = $("#sageBox", host);
    box.innerHTML = `<div class="sage"><b>${ICON.sage} The Sage</b><span>Thinking…</span></div>`;
    const r = await runPython(ed.get(), { inputs: (task.tests[0] || { in: [] }).in, limit: 2000 });
    const prompt = `You are the Sage, a warm coding mentor inside a beginner Python learning game. The learner is stuck.
Task: ${stripTags(task.brief)}
${task.sample ? "Expected example run:\n" + task.sample + "\n" : ""}Their code:
\`\`\`python
${ed.get()}
\`\`\`
What happened when it ran${(task.tests[0] || { in: [] }).in.length ? " with inputs " + JSON.stringify(task.tests[0].in) : ""}: ${r.error ? r.error.name + ": " + r.error.msg + (r.error.line ? " on line " + r.error.line : "") : "Output was:\n" + r.out}
Give ONE short Socratic hint (at most 60 words) that points them toward the problem. Do NOT write the corrected code or the full solution. You may name a line number or a concept. Plain text, no markdown headings.`;
    try {
      const res = await S.sample(prompt, { modelTier: "quick", cache: false, onText: ({ text }) => { const sp = $(".sage span", box); if (sp) sp.textContent = text; } });
      $(".sage span", box).textContent = res.text;
      if (!isBug) { meta.sage = (meta.sage || 0) + 1; save(); }
    } catch (e) {
      if (e && e.code === "not_granted") { S.sample = null; box.innerHTML = ""; drawHints(); return; }
      $(".sage span", box).textContent = e && e.code === "rate_limited" ? "The Sage needs a short rest. Try a hint, or ask again in a minute." : "The Sage couldn't answer just now. Try a hint instead.";
    }
    btn.disabled = false;
  };

  const runBtn = $("#runBtn", host), checkBtn = $("#checkBtn", host);
  runBtn.addEventListener("click", () => runInBench(ed, con, runBtn));
  $("#resetBtn", host).addEventListener("click", () => {
    ed.set(isBug ? task.code : task.starter);
    lsSet(draftKey, null);
    con.hint("Code reset.");
  });
  checkBtn.addEventListener("click", async () => {
    if (pyBusy) return;
    checkBtn.disabled = true; runBtn.disabled = true;
    con.hint("Checking…");
    const res = await runTests(task, ed.get());
    checkBtn.disabled = false; runBtn.disabled = false;
    const box = $("#tests", host);
    $("#codeMsg", host).innerHTML = res.codeMsg ? `<div class="notice">${res.codeMsg}</div>` : "";
    if (res.results.length) {
      box.innerHTML = res.results.map((r, i) => `<div class="test ${r.pass ? "pass" : "fail"}"><span class="s">${r.pass ? ICON.check : ICON.cross}</span><span class="msg">${r.input.length ? "Typing " + r.input.map((x) => `<code>${esc(x)}</code>`).join(" then ") + ": " : ""}${r.pass ? "passed" : r.msg}</span></div>`).join("");
      const firstFail = res.results.find((r) => !r.pass);
      con.clear();
      if (firstFail) {
        con.write(firstFail.out || "");
        if (firstFail.error) { con.error(firstFail.error); if (firstFail.error.line) ed.mark(firstFail.error.line); }
      } else con.write(res.results[res.results.length - 1].out);
    } else con.hint("Fix the note on the left, then check again.");
    if (!res.pass) {
      if (!isBug) { meta.fails = (meta.fails || 0) + 1; save(); drawHints(); }
      return;
    }
    if (isBug) {
      if (!s.b) { s.b = 1; addXP(XP.bug, "Bug squashed"); }
      $("#codeMsg", host).innerHTML = `<div class="notice good"><b>Bug squashed.</b> Reading the error message first is the habit that makes debugging fast.</div>`;
    } else {
      const used = (meta.h || 0) + (meta.sage || 0);
      const stars = meta.rev ? 1 : Math.max(1, 3 - used);
      const prev = s.c && s.c.ok ? s.c.s : 0;
      s.c = { ok: 1, s: Math.max(prev, stars) };
      scheduleCards(L.id);
      if (!prev) addXP(XP.codeBase + XP.codeStar * stars, `Forge cleared · ${stars} star${stars > 1 ? "s" : ""}`);
      else if (stars > prev) addXP(XP.codeStar * (stars - prev), "More stars");
      else save();
      $("#codeMsg", host).innerHTML = `<div class="notice good"><b>All tests passed!</b> ${starsHtml(stars)}${stars < 3 ? "<br>Replay later without hints for three stars." : ""}</div>`;
      meta.h = 0; meta.sage = 0; meta.fails = 0; meta.rev = 0;
      save();
    }
    $("#stageNext", host).innerHTML = nextStageBtn(L, kind);
    bindNext(host, L);
    const step = $(`[data-stage="${kind}"] .v`); if (step && !step.querySelector("svg")) step.insertAdjacentHTML("afterbegin", ICON.check);
    afterStage(L);
  });
}
const stageCode = (h, L) => challengeStage(h, L, "code");
const stageBug = (h, L) => challengeStage(h, L, "bug");

function stageExplain(host, L) {
  const s = lv(L.id);
  const draftKey = draftNS() + L.id + ".explain";
  const val = s.e || lsGet(draftKey) || "";
  host.innerHTML = `
    <div class="stage-intro"><h2>Tavern Talk</h2><span class="muted">Explaining code out loud is half of every interview. Practise it here.</span></div>

      <div class="eyebrow">The innkeeper asks</div>
      <h3 style="font-size:18px;font-weight:600">${L.explain}</h3>

      <div class="row"><span class="wc" id="wc"></span>${S.sample ? `<button class="btn" id="fbBtn">${ICON.sage} Get interviewer feedback</button>` : ""}<button class="btn primary" id="saveExpl">${s.e ? "Update answer" : "Save answer"}</button></div>
      <div id="fb"></div>
    </div>

  const ta = $("#expl"), wc = $("#wc");
  const count = () => { const n = (ta.value.trim().match(/\S+/g) || []).length; wc.textContent = `${n} words${n < 12 ? " · aim for at least 12" : ""}`; return n; };
  count();
  ta.addEventListener("input", () => { count(); lsSet(draftKey, ta.value); });
  $("#saveExpl").addEventListener("click", () => {
    if (count() < 12) { wc.textContent = "A little more, please. Aim for at least 12 words."; ta.focus(); return; }
    const first = !s.e;
    s.e = ta.value.trim().slice(0, 2000);
    if (first) addXP(XP.explain, "Explained it"); else save();

  const fb = $("#fbBtn");
  if (fb) fb.addEventListener("click", async () => {

    fb.disabled = true;
    const box = $("#fb");
    box.innerHTML = `<div class="sage"><b>${ICON.sage} Interviewer feedback</b><span>Reading…</span></div>`;
    const prompt = `You are a kind but honest junior-developer interviewer. A beginner learning Python was asked: "${stripTags(L.explain)}"
Their answer: "${ta.value.trim()}"
In at most 70 words: say whether it's correct, name one thing they did well, and one specific way to make it clearer or more precise. Plain text, no headings, no bullet points.`;
    try {
      const res = await S.sample(prompt, { modelTier: "quick", cache: false, onText: ({ text }) => { const sp = $(".sage span", box); if (sp) sp.textContent = text; } });

    } catch (e) {
      if (e && e.code === "not_granted") { S.sample = null; box.innerHTML = ""; fb.remove(); return; }
      $(".sage span", box).textContent = "Feedback isn't available right now. Try again in a minute.";
    }
    fb.disabled = false;
  });
  const wb = $("[data-world]", host); if (wb) wb.addEventListener("click", () => go({ name: "world", id: L.world }));
}

function renderReview(v) {
  const due = dueCards();
  const all = Object.keys(S.hero.cards);
  const nextDue = all.length ? Object.values(S.hero.cards).map((c) => c.due).sort()[0] : null;

async function boot(hot) {
  if (hot && hot.route) S.route = hot.route;
  setSync("local", "Connecting…");
  const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [db, user, sample] = await Promise.all([use("db"), use("user"), use("sample")]);
  S.db = db; S.user = user; S.sample = sample;
  try { S.uid = user ? await user.id() : null; } catch (_) { S.uid = null; }
  let hero = null;
  migrateLegacy();
  if (db && S.uid) {
    S.mode = "cloud";
    S.ref = db.doc("heroes/" + S.uid);
    try {
      let snap;
      try { snap = await S.ref.get(); } catch (e) { await new Promise((r) => setTimeout(r, 800)); snap = await S.ref.get(); }
      hero = snap.exists ? cleanHero(snap.data()) : null;
    } catch (_) { S.mode = "local"; }
    if (S.mode === "cloud") {
      S.unsub = db.collection("heroes").limit(200).onSnapshot((qs) => {
        const o = {};
        qs.docs.forEach((d) => { if (d.id !== S.uid) { const h = cleanHero(d.data()); if (h) o[d.id] = h; } });
        S.others = o;
        if (S.hero && ["map", "guild", "world"].includes(S.route.name)) render();
      }, () => {});
    }
  } else S.mode = "local";
  if (S.mode === "cloud" && !hero) hero = cleanHero(lsGet(localKey()));
  S.cloudHero = S.mode === "cloud" ? hero : null;
  S.hero = null;
  if (S.mode === "cloud") setSync("ok", "Saved");
  else {
    setSync("local", "Saved on this device");
    showBanner("Playing offline: your progress saves in this browser. Open the claude.ai version while signed in to join the shared Guild board.");
  }
  render();
}
function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
}

const SLOT_COUNT = 3;
const slotKey = (n) => "cq.slot." + n;
const pinKey = (n) => "cq.pin." + n;
const ssGet = (k) => { try { return sessionStorage.getItem(k); } catch (_) { return null; } };
const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (_) {} };

async function hashPin(slot, pin) {
  const text = "codequest:" + slot + ":" + pin;
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch (_) {
    let h = 7;
    for (const c of text) h = (h * 31 + c.charCodeAt(0)) | 0;
    return "x" + h;
  }
}
function migrateLegacy() {
  const old = lsGet("cq.hero.local");
  if (old && !lsGet(slotKey(1))) { lsSet(slotKey(1), old); try { localStorage.removeItem("cq.hero.local"); } catch (_) {} }
}

/* ── Pixel scene (canvas, drawn at low resolution and scaled up) ── */
let sceneRaf = null;
function startScene(canvas) {
  const W = 192, H = 108;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let seed = 11;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const stars = Array.from({ length: 70 }, () => ({ x: (rnd() * W) | 0, y: (rnd() * 58) | 0, p: rnd() * 6, big: rnd() > .9 }));
  const clouds = Array.from({ length: 4 }, (_, i) => ({ x: rnd() * W, y: 12 + i * 9 + rnd() * 6, w: 14 + (rnd() * 14) | 0, v: .05 + rnd() * .08 }));
  const flies = Array.from({ length: 10 }, () => ({ x: rnd() * W, y: 80 + rnd() * 14, p: rnd() * 6 }));
  const band = ["#1a1c2c", "#1f2340", "#252c55", "#29366f", "#30428a", "#3b5dc9"];
  const sp = SPRITES[(Date.now() / 86400000 | 0) % SPRITES.length];
  const spPal = Object.assign({}, PIX_BASE, sp.pal);
  let t = 0, shoot = null, last = 0;

  const ridge = (x, base, amp, f1, f2, off) => base - Math.round(amp * (Math.sin((x + off) * f1) * .6 + Math.sin((x + off) * f2 + 1.7) * .4));
  function draw() {
    // Sky bands with a dithered seam between each
    const bh = 64 / band.length;
    for (let i = 0; i < band.length; i++) {
      ctx.fillStyle = band[i]; ctx.fillRect(0, Math.round(i * bh), W, Math.ceil(bh) + 1);
      if (i > 0) { ctx.fillStyle = band[i - 1]; const y = Math.round(i * bh); for (let x = 0; x < W; x += 2) ctx.fillRect(x + (y % 2), y, 1, 1); }
    }
    ctx.fillStyle = band[band.length - 1]; ctx.fillRect(0, 64, W, H - 64);
    // Stars
    stars.forEach((s) => {
      const on = Math.sin(t * .05 + s.p * 3) > -.3;
      if (!on) return;
      ctx.fillStyle = s.big ? "#ffcd75" : "#f4f4f4";
      ctx.fillRect(s.x, s.y, 1, 1);
      if (s.big && Math.sin(t * .05 + s.p) > .5) { ctx.fillRect(s.x - 1, s.y, 3, 1); ctx.fillRect(s.x, s.y - 1, 1, 3); }
    });
    // Shooting star
    if (!shoot && !reduce && Math.random() < .004) shoot = { x: 40 + Math.random() * 120, y: 4 + Math.random() * 16, l: 0 };
    if (shoot) {
      ctx.fillStyle = "#f4f4f4";
      for (let i = 0; i < 6; i++) ctx.fillRect(shoot.x - i, shoot.y - (i >> 1), 1, 1);
      shoot.x += 2.4; shoot.y += 1.2; if (++shoot.l > 30) shoot = null;
    }
    // Moon
    ctx.fillStyle = "#f4f4f4";
    for (let y = -8; y <= 8; y++) for (let x = -8; x <= 8; x++) if (x * x + y * y <= 64) ctx.fillRect(158 + x, 20 + y, 1, 1);
    ctx.fillStyle = "#c2d1dc"; [[155, 17, 2], [161, 23, 2], [160, 15, 1]].forEach(([cx, cy, r]) => { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r) ctx.fillRect(cx + x, cy + y, 1, 1); });
    // Clouds
    clouds.forEach((c) => {
      ctx.fillStyle = "#566c86";
      const x = Math.round(c.x);
      ctx.fillRect(x, c.y, c.w, 3); ctx.fillRect(x + 3, c.y - 2, c.w - 7, 2); ctx.fillRect(x + 6, c.y - 3, 5, 1);
      c.x += reduce ? 0 : c.v; if (c.x > W + 4) c.x = -c.w - 4;
    });
    // Far mountains
    ctx.fillStyle = "#333c57";
    for (let x = 0; x < W; x++) { const y = ridge(x, 70, 12, .045, .11, t * .02); ctx.fillRect(x, y, 1, H - y); }
    // Snow caps
    ctx.fillStyle = "#94b0c2";
    for (let x = 0; x < W; x++) { const y = ridge(x, 70, 12, .045, .11, t * .02); if (y < 62) ctx.fillRect(x, y, 1, 2); }
    // Castle on the hill
    const cx = 120, gy = 78;
    ctx.fillStyle = "#1a1c2c";
    ctx.fillRect(cx, gy - 18, 34, 18);
    ctx.fillRect(cx - 4, gy - 28, 9, 28); ctx.fillRect(cx + 29, gy - 28, 9, 28); ctx.fillRect(cx + 13, gy - 34, 8, 16);
    for (let i = 0; i < 3; i++) { ctx.fillRect(cx - 4 + i * 3, gy - 30, 2, 2); ctx.fillRect(cx + 29 + i * 3, gy - 30, 2, 2); }
    for (let i = 0; i < 2; i++) ctx.fillRect(cx + 13 + i * 5, gy - 36, 3, 2);
    for (let i = 0; i < 6; i++) ctx.fillRect(cx + 2 + i * 5, gy - 20, 3, 2);
    ctx.fillStyle = "#b13e53"; ctx.fillRect(cx + 17, gy - 42, 1, 8); ctx.fillRect(cx + 18, gy - 42 + ((t >> 3) % 2), 4, 3);
    const lit = (i) => Math.sin(t * .03 + i * 1.9) > -.6;
    ctx.fillStyle = "#ffcd75";
    [[cx - 1, gy - 22], [cx + 32, gy - 22], [cx + 16, gy - 28], [cx + 8, gy - 12], [cx + 24, gy - 12]].forEach(([x, y], i) => { if (lit(i)) ctx.fillRect(x, y, 2, 3); });
    ctx.fillStyle = "#5d275d"; ctx.fillRect(cx + 14, gy - 8, 6, 8);
    // Near hills
    ctx.fillStyle = "#257179";
    for (let x = 0; x < W; x++) { const y = ridge(x, 84, 5, .06, .15, 40); ctx.fillRect(x, y, 1, H - y); }
    // Ground
    ctx.fillStyle = "#38b764"; ctx.fillRect(0, 92, W, H - 92);
    ctx.fillStyle = "#a7f070"; ctx.fillRect(0, 92, W, 1);
    ctx.fillStyle = "#257179"; for (let x = 0; x < W; x += 7) ctx.fillRect((x + 3) % W, 96 + (x % 3) * 3, 2, 1);
    ctx.fillStyle = "#ef7d57"; for (let x = 0; x < W; x += 6) ctx.fillRect(x, 100, 4, 2);
    // Walking hero
    const hx = Math.round((t * .35) % (W + 24)) - 12, bob = (t >> 3) % 2;
    sp.rows.forEach((row, y) => { for (let x = 0; x < 12; x++) { const ch = row[x]; if (ch !== "." && spPal[ch]) { ctx.fillStyle = spPal[ch]; ctx.fillRect(hx + x, 80 + y - bob, 1, 1); } } });
    // Fireflies
    flies.forEach((f) => { if (Math.sin(t * .08 + f.p * 4) > .2) { ctx.fillStyle = "#ffcd75"; ctx.fillRect(Math.round(f.x + Math.sin(t * .02 + f.p) * 4), Math.round(f.y + Math.cos(t * .03 + f.p) * 2), 1, 1); } });
  }
  function loop(now) {
    if (now - last > 66) { last = now; t++; draw(); }
    sceneRaf = requestAnimationFrame(loop);
  }
  if (sceneRaf) cancelAnimationFrame(sceneRaf);
  if (reduce) { t = 40; draw(); } else sceneRaf = requestAnimationFrame(loop);
}

    else enterSlot(n);
  }));
  $$("[data-new]", ui).forEach((b) => b.addEventListener("click", () => titleStep("create", { slot: +b.dataset.new })));
  $("#back").addEventListener("click", () => titleStep("start"));
  const first = $(".file", ui); if (first) first.focus();
}

function enterSlot(n) {
  S.slot = n;
  ssSet("cq.unlocked", String(n));
  enterGame(cleanHero(lsGet(slotKey(n))));
}
function enterGame(hero) {
  S.hero = hero;
  leaveTitle();
  recompute();
  save();
  go({ name: "map" });
}

function createHero(ui, opt) {
  const pick = { name: "", pix: (Math.random() * SPRITES.length) | 0, color: 1, pin: "" };
  (async () => {
    try { const me = S.user ? await S.user.me() : null; if (me && me.name && !pick.name) { pick.name = me.name.split(" ")[0].slice(0, 16); const f = $("#cName"); if (f && !f.value) { f.value = pick.name; drawPrev(); } } } catch (_) {}
  })();
  ui.innerHTML = `
    <div class="pbox creator">
      <h2 class="ptitle">Create your hero</h2>
      <div class="creator-grid">
        <div class="pedestal" id="prev"></div>
        <div class="creator-form">
          <label class="plabel" for="cName">Hero name</label>
          <input class="pinput" id="cName" maxlength="16" autocomplete="off" placeholder="Type a name">
          <span class="plabel">Choose a character</span>
          <div class="char-grid" id="chars">${SPRITES.map((s, i) => `<button class="char" data-pix="${i}" aria-label="${s.name}" title="${s.name}">${pixelSvg(i)}</button>`).join("")}</div>
          <span class="plabel">Background</span>
          <div class="swatches" id="cols">${HERO_COLORS.map((c, i) => `<button class="swatch" data-col="${i}" aria-label="Colour ${i + 1}" style="background:${c}"></button>`).join("")}</div>
          ${opt.cloud ? "" : `<label class="plabel" for="cPin">PIN lock</label>
          <span class="pnote" style="font-size:12.5px">Optional. 4 digits so nobody else on this computer plays your file.</span>
          <input class="pinput pin" id="cPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">`}
        </div>
      </div>
      <p class="perr" id="cErr" role="alert"></p>
      <div class="prow"><button class="pbtn alt" id="cBack">◂ Back</button><button class="pbtn" id="cGo">Start quest ▸</button></div>
    </div>`;
  const drawPrev = () => {
    $("#prev").innerHTML = `${avatarHtml(pick, "hero")}<b>${esc($("#cName").value.trim() || "???")}</b><span>${SPRITES[pick.pix].name}</span>`;
    $$(".char", ui).forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.pix === pick.pix)));
    $$(".swatch", ui).forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.col === pick.color)));
  };
  drawPrev();
  $("#cName").focus();
  $("#cName").addEventListener("input", drawPrev);
  $$(".char", ui).forEach((b) => b.addEventListener("click", () => { pick.pix = +b.dataset.pix; drawPrev(); }));
  $$(".swatch", ui).forEach((b) => b.addEventListener("click", () => { pick.color = +b.dataset.col; drawPrev(); }));
  const pinEl = $("#cPin");
  if (pinEl) pinEl.addEventListener("input", () => { pinEl.value = pinEl.value.replace(/\D/g, "").slice(0, 4); });
  $("#cBack").addEventListener("click", () => titleStep("files"));
  $("#cGo").addEventListener("click", async () => {
    const name = $("#cName").value.trim();
    const err = $("#cErr");
    if (!name) { err.textContent = "Every hero needs a name."; $("#cName").focus(); return; }
    const pin = pinEl ? pinEl.value : "";
    if (pin && pin.length !== 4) { err.textContent = "A PIN needs exactly 4 digits, or leave it empty."; pinEl.focus(); return; }
    const hero = blankHero(name.slice(0, 16), pick.pix, pick.color);
    if (opt.cloud) { S.cloudHero = hero; enterGame(hero); setTimeout(openGuide, 400); return; }
    S.slot = opt.slot;
    if (pin) lsSet(pinKey(opt.slot), await hashPin(opt.slot, pin));
    else lsSet(pinKey(opt.slot), null);
    lsSet(slotKey(opt.slot), hero);
    enterSlot(opt.slot);
    setTimeout(openGuide, 400);
  });
}

function pinPad(ui, n) {
  const h = cleanHero(lsGet(slotKey(n)));
  let entry = "";
  ui.innerHTML = `
    <div class="pbox pinbox">
      <h2 class="ptitle">File ${n} is locked</h2>
      <div class="pin-who">${avatarHtml(h, "xl")}<b>${esc(h.name)}</b></div>
      <div class="pin-dots" id="dots" aria-live="polite"></div>
      <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "◂", 0, "OK"].map((k) => `<button class="key" data-k="${k}" aria-label="${k === "◂" ? "Delete" : k}">${k}</button>`).join("")}</div>
      <p class="perr" id="pErr" role="alert"></p>
      <div class="prow"><button class="pbtn alt" id="pBack">◂ Back</button></div>
    </div>`;
  const dots = () => { $("#dots").innerHTML = [0, 1, 2, 3].map((i) => `<i class="${i < entry.length ? "on" : ""}"></i>`).join(""); };
  dots();
  const tryPin = async () => {
    if (entry.length !== 4) return;
    const ok = (await hashPin(n, entry)) === lsGet(pinKey(n));
    if (ok) { setTitleKeys(null); enterSlot(n); return; }
    entry = ""; dots();
    $("#pErr").textContent = "Wrong PIN. Try again.";
    const box = $(".pinbox"); box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
  };
  const press = (k) => {
    $("#pErr").textContent = "";
    if (k === "◂") entry = entry.slice(0, -1);
    else if (k === "OK") return tryPin();
    else if (entry.length < 4) entry += k;
    dots();
    if (entry.length === 4) tryPin();
  };
  $$(".key", ui).forEach((b) => b.addEventListener("click", () => press(b.dataset.k)));
  setTitleKeys((e) => {
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("◂");
    else if (e.key === "Enter") press("OK");
    else if (e.key === "Escape") titleStep("files");
  });
  $("#pBack").addEventListener("click", () => titleStep("files"));
  $(".key", ui).focus();
}

function logOut() {
  flush();
  if (S.mode === "cloud") S.cloudHero = S.hero;
  S.hero = null;
  S.slot = null;
  try { sessionStorage.removeItem("cq.unlocked"); } catch (_) {}
  S.route = { name: "map" };
  render();
  titleStep("files");
}

/* Profile page: hero card, edit form, PIN lock and account actions. */

const ROLES = ["Not sure yet", "Backend developer", "Data analyst", "Automation / QA engineer", "Full-stack developer", "AI / ML engineer"];

function renderProfile(v) {
  const h = S.hero;
  const draft = { name: h.name, pix: h.pix, color: h.color, motto: h.motto || "", role: h.role | 0 };
  const cleared = LEVELS.filter((L) => levelClear(L.id)).length;
  const hasPin = S.mode !== "cloud" && !!lsGet(pinKey(S.slot));
  v.innerHTML = `
  <div class="wrap profile">
    <button class="crumb" data-back>${ICON.back} World map</button>
    <div class="profile-grid">
      <div class="card hero-card" id="heroCard"></div>
      <div class="card edit-card">
        <h2 class="pixel" style="font-size:24px">Edit profile</h2>
        <div class="field"><label for="pName">Hero name</label><input type="text" id="pName" maxlength="16" value="${esc(draft.name)}"></div>
        <div class="field"><label for="pMotto">Motto <span class="muted" style="font-weight:400">shown on the Guild board</span></label><input type="text" id="pMotto" maxlength="40" value="${esc(draft.motto)}" placeholder="e.g. One bug at a time"></div>
        <div class="field"><label for="pRole">Dream job</label><select id="pRole">${ROLES.map((r, i) => `<option value="${i}" ${i === draft.role ? "selected" : ""}>${r}</option>`).join("")}</select></div>
        <div class="field"><label>Character</label><div class="char-grid light" id="pChars">${SPRITES.map((s, i) => `<button class="char" data-pix="${i}" aria-label="${s.name}" title="${s.name}">${pixelSvg(i)}</button>`).join("")}</div></div>
        <div class="field"><label>Background</label><div class="swatches" id="pCols">${HERO_COLORS.map((c, i) => `<button class="swatch" data-col="${i}" aria-label="Colour ${i + 1}" style="background:${c}"></button>`).join("")}</div></div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="pSave">Save profile</button><span class="muted" id="pMsg" style="font-size:13px"></span></div>

        ${S.mode === "cloud" ? "" : `<hr class="sep">
        <h3 class="sub">PIN lock</h3>
        <p class="muted" style="font-size:13.5px">${hasPin ? "Your save file is locked with a PIN." : "Lock your save file so other people on this computer can't play it."} A PIN is a friendly lock for sharing a computer, not bank-level security.</p>
        <div id="pinArea" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <input type="password" id="newPin" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" class="pin-field" autocomplete="off">
          <button class="btn sm" id="setPin">${hasPin ? "Change PIN" : "Set PIN"}</button>
          ${hasPin ? `<button class="btn sm ghost" id="rmPin">Remove PIN</button>` : ""}
        </div>`}

        <hr class="sep">
        <h3 class="sub">Sync with your other version</h3>
        <p class="muted" style="font-size:13.5px">The claude.ai game and the desktop game save separately. Copy your save code here, then paste it into Profile on the other version. Progress is combined, so nothing from either side is lost.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn sm" id="copyCode">Copy my save code</button><span class="muted" id="copyMsg" style="font-size:13px"></span></div>
        <textarea id="codeOut" class="code-box" readonly hidden aria-label="Your save code"></textarea>
        <label class="sr" for="codeIn">Paste a save code</label>
        <textarea id="codeIn" class="code-box" placeholder="Paste a save code from your other version here"></textarea>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn sm primary" id="useCode">Combine progress</button><span class="muted" id="useMsg" style="font-size:13px"></span></div>

        <hr class="sep">
        <h3 class="sub">Account</h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" id="pOut">${S.mode === "cloud" ? "Back to title screen" : "Switch player"}</button>
        </div>
        <div id="danger" style="margin-top:6px"><button class="btn ghost sm" id="pReset" style="color:var(--danger)">${S.mode === "cloud" ? "Reset all progress" : "Delete this save file"}</button></div>
      </div>
    </div>
  </div>`;

  const card = () => {
    const rk = rankFor(h.xp).r;
    $("#heroCard").innerHTML = `
      <div class="hero-banner" style="--hc:${HERO_COLORS[draft.color]}">${avatarHtml(draft, "hero")}</div>
      <div class="hero-info">
        <p class="eyebrow">${esc(rk.name)} · ${esc(SPRITES[draft.pix].name)}</p>
        <h1 class="pixel">${esc(draft.name || "???")}</h1>
        ${draft.motto ? `<p class="motto">“${esc(draft.motto)}”</p>` : `<p class="muted">No motto yet.</p>`}
        <span class="role-chip">Aiming for: ${esc(ROLES[draft.role])}</span>
      </div>
      <div class="stat-grid">
        <div><b class="num">${h.xp}</b><span>XP</span></div>
        <div><b class="num">${h.stars}</b><span>Stars</span></div>
        <div><b class="num">${cleared}/${LEVELS.length}</b><span>Levels cleared</span></div>
        <div><b class="num">${liveStreak(h)}</b><span>Day streak</span></div>
        <div><b class="num">${h.best}</b><span>Best streak</span></div>
        <div><b class="num">${readiness()}%</b><span>Job-ready</span></div>
      </div>
      <p class="muted" style="font-size:12.5px">Questing since ${esc(h.created)}. ${S.mode === "cloud" ? "Saved to your Claude account." : "Saved in this browser, file " + S.slot + "."}</p>`;
    $$("#pChars .char").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.pix === draft.pix)));
    $$("#pCols .swatch").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.col === draft.color)));
    fixSvgVars($("#heroCard"));
  };
  card();
  $("[data-back]", v).addEventListener("click", () => go({ name: "map" }));
  $("#pName").addEventListener("input", (e) => { draft.name = e.target.value; card(); });
  $("#pMotto").addEventListener("input", (e) => { draft.motto = e.target.value; card(); });
  $("#pRole").addEventListener("change", (e) => { draft.role = +e.target.value; card(); });
  $$("#pChars .char").forEach((b) => b.addEventListener("click", () => { draft.pix = +b.dataset.pix; card(); }));
  $$("#pCols .swatch").forEach((b) => b.addEventListener("click", () => { draft.color = +b.dataset.col; card(); }));
  $("#pSave").addEventListener("click", () => {
    const n = draft.name.trim();
    if (!n) { $("#pMsg").textContent = "Your hero needs a name."; $("#pName").focus(); return; }
    Object.assign(h, { name: n.slice(0, 16), pix: draft.pix, color: draft.color, motto: draft.motto.trim().slice(0, 40), role: draft.role });
    save();
    renderChip();
    $("#pMsg").textContent = "Saved.";

  });

  const setPin = $("#setPin");
  if (setPin) {
    const f = $("#newPin");
    f.addEventListener("input", () => { f.value = f.value.replace(/\D/g, "").slice(0, 4); });

      lsSet(pinKey(S.slot), await hashPin(S.slot, f.value));
      toast("PIN saved");
      renderProfile(v);
    });
    const rm = $("#rmPin");
    if (rm) rm.addEventListener("click", () => { lsSet(pinKey(S.slot), null); toast("PIN removed"); renderProfile(v); });
  }
  $("#copyCode").addEventListener("click", () => {
    const code = encodeSave(S.hero);
    const out = $("#codeOut");
    const showBox = () => { out.hidden = false; out.value = code; out.focus(); out.select(); $("#copyMsg").textContent = "Select all and copy this code."; };
    try {
      navigator.clipboard.writeText(code).then(() => { $("#copyMsg").textContent = "Copied! Paste it into Profile on your other version."; }, showBox);
    } catch (_) { showBox(); }
  });
  $("#useCode").addEventListener("click", () => {
    const other = decodeSave($("#codeIn").value);
    const msg = $("#useMsg");
    if (!other) { msg.textContent = "That doesn't look like a Code Quest save code. Copy the whole thing and try again."; return; }
    const lvls = () => { const n = LEVELS.filter((L) => levelClear(L.id)).length; return n + (n === 1 ? " level" : " levels"); };
    const before = { xp: h.xp, done: lvls() };
    mergeInto(h, other);
    save();
    toast(`<span class="x">Synced</span> ${h.xp} XP · ${lvls()} cleared`);
    renderChip();
    renderNav();
    renderProfile(v);
    $("#useMsg").textContent = `Combined. Was ${before.xp} XP and ${before.done}, now ${h.xp} XP and ${lvls()}.`;
  });
  $("#pOut").addEventListener("click", logOut);
  $("#pReset").addEventListener("click", () => {
    const cloud = S.mode === "cloud";
    $("#danger").innerHTML = `<div class="notice">${cloud ? "This erases your XP, stars and streak." : "This deletes save file " + S.slot + " for good: XP, stars, streak and PIN."} It can't be undone.
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn sm" id="rNo">Keep it</button><button class="btn sm" id="rYes" style="background:var(--danger);color:#fff;border-color:var(--danger)">${cloud ? "Erase everything" : "Delete file"}</button></div></div>`;
    $("#rNo").addEventListener("click", () => renderProfile(v));
    $("#rYes").addEventListener("click", () => {
      const ns = draftNS();
      try { Object.keys(localStorage).filter((k) => k.startsWith(ns)).forEach((k) => localStorage.removeItem(k)); } catch (_) {}
      if (cloud) {
        S.hero = blankHero(h.name, h.pix, h.color);
        save();
        go({ name: "map" });
      } else {
        lsSet(slotKey(S.slot), null);
        lsSet(pinKey(S.slot), null);
        S.hero = null;
        logOut();
      }
    });
  });
}

/* ── Save codes: move progress between the claude.ai and desktop versions ── */
function encodeSave(hero) {
  const json = JSON.stringify(hero);
  const bytes = new TextEncoder().encode(json);
  let bin = "";
  bytes.forEach((b) => (bin += String.fromCharCode(b)));
  return "CQ1." + btoa(bin);
}
function decodeSave(text) {
  const m = /CQ1\.([A-Za-z0-9+/=\s]+)/.exec(String(text || ""));
  if (!m) return null;
  try {
    const bin = atob(m[1].replace(/\s+/g, ""));
    const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
    return cleanHero(JSON.parse(new TextDecoder().decode(bytes)));
  } catch (_) { return null; }
}
/* Combine another save into this one, keeping the best of both for every level.
   Name, character and colour stay as they are on this version. */
function mergeInto(h, o) {
  h.xp = Math.max(h.xp, o.xp);
  h.best = Math.max(h.best, o.best);
  if ((o.last || "") > (h.last || "")) { h.last = o.last; h.streak = o.streak; }
  else if (o.last === h.last) h.streak = Math.max(h.streak, o.streak);
  if (o.created && (!h.created || o.created < h.created)) h.created = o.created;
  for (const [d, x] of Object.entries(o.days || {})) h.days[d] = Math.max(h.days[d] || 0, x);
  for (const [id, b] of Object.entries(o.lv || {})) {
    const a = (h.lv[id] = h.lv[id] || {});
    if (b.l) a.l = 1;
    if (b.b) a.b = 1;
    if (b.d) a.d = 1;
    if (Array.isArray(b.t)) { a.t = a.t || []; b.t.forEach((v, i) => { if (v && (!a.t[i] || v < a.t[i])) a.t[i] = v; }); }
    if (b.c && b.c.ok) a.c = { ok: 1, s: Math.max((a.c && a.c.ok && a.c.s) || 0, b.c.s || 1) };
    if (typeof b.e === "string" && b.e.length > (a.e || "").length) a.e = b.e;
  }
  for (const [k, c] of Object.entries(o.cards || {})) {
    const a = h.cards[k];
    if (!a || c.b > a.b || (c.b === a.b && c.due > a.due)) h.cards[k] = { b: c.b | 0, due: String(c.due) };
  }
  for (const [k, arr] of Object.entries(o.home || {})) {
    if (!Array.isArray(arr)) continue;
    const a = (h.home[k] = h.home[k] || []);
    arr.forEach((v, i) => { if (v) a[i] = 1; });
  }
  if (!h.motto && o.motto) h.motto = o.motto;
  if (!h.role && o.role) h.role = o.role;
  recompute();
}
